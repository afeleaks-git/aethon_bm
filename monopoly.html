<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pok&eacute;mon Monopoly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0d0d1a 0%,#1a1a3e 40%,#0a2a4e 100%);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 50%,rgba(255,203,5,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,107,53,.03) 0%,transparent 50%)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,203,5,.35);border-radius:4px}
h1{font-size:1.7em;margin:10px 0;text-align:center;text-shadow:0 0 30px rgba(255,203,5,.3);background:linear-gradient(90deg,#ffcb05,#ff6b35,#ffcb05);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;letter-spacing:-.5px}
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:500px;margin:0 auto;padding:8px;position:relative;z-index:1}
.screen.active{display:flex}

/* Modern buttons */
.btn{padding:11px 26px;border:none;border-radius:25px;background:linear-gradient(135deg,#ffcb05 0%,#f0a500 100%);color:#1a1a2e;font-size:1em;font-weight:700;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);margin:6px 4px;white-space:nowrap;box-shadow:0 4px 15px rgba(255,203,5,.25),inset 0 1px 0 rgba(255,255,255,.2);text-shadow:0 1px 0 rgba(255,255,255,.2);letter-spacing:.3px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,.3);transition:all .4s;transform:translate(-50%,-50%)}
.btn:active::after{width:200px;height:200px;opacity:0}
.btn:active{transform:scale(.93);box-shadow:0 2px 8px rgba(255,203,5,.2)}
.btn:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}
.btn.small{padding:7px 16px;font-size:.82em;margin:4px 3px;border-radius:20px}
.btn.danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;box-shadow:0 4px 15px rgba(231,76,60,.25);text-shadow:none}
.btn.success{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 4px 15px rgba(46,204,113,.25);text-shadow:none}
.btn.outline{background:transparent;border:2px solid rgba(255,203,5,.5);color:#ffcb05;box-shadow:none;text-shadow:none}
.btn.outline:active{background:rgba(255,203,5,.15)}

/* Setup screen */
.setup-section{width:100%;margin:8px 0;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.setup-section h3{color:#ffcb05;font-size:.95em;margin-bottom:6px;font-weight:700}
.player-setup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.player-setup input{flex:1;min-width:120px;padding:10px 14px;border:2px solid rgba(255,203,5,.3);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font-size:.95em;outline:none;transition:all .2s;backdrop-filter:blur(5px)}
.player-setup input:focus{border-color:#ffcb05;background:rgba(255,203,5,.08);box-shadow:0 0 15px rgba(255,203,5,.15)}
.pokemon-select{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pokemon-opt{display:flex;flex-direction:column;align-items:center;padding:6px 3px;border:2px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1)}
.pokemon-opt:active{transform:scale(.9)}
.pokemon-opt.selected{border-color:#ffcb05;background:rgba(255,203,5,.15);box-shadow:0 0 15px rgba(255,203,5,.2);transform:scale(1.02)}
.pokemon-opt.taken{opacity:.2;pointer-events:none}
.pokemon-opt img{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.pokemon-opt span{font-size:.58em;color:#bbb;margin-top:2px;font-weight:600}
.player-count-sel{display:flex;gap:8px;margin:8px 0}
.player-count-sel .btn.active{background:linear-gradient(135deg,#ffcb05,#f0a500);color:#1a1a2e;box-shadow:0 4px 20px rgba(255,203,5,.35)}

/* Board screen */
#board-screen{max-width:100%;padding:4px}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 8px;flex-wrap:wrap;gap:4px}
.top-bar .current-player{display:flex;align-items:center;gap:6px;font-size:.85em}
.top-bar .current-player img{width:28px;height:28px;image-rendering:pixelated}
.top-bar .money{color:#ffcb05;font-weight:bold}
.actions-bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px;width:100%}

/* View toggle */
.view-toggle{display:flex;gap:4px;justify-content:center;margin:4px 0}
.view-toggle button{padding:5px 14px;border:1px solid rgba(255,203,5,.3);border-radius:16px;background:rgba(255,255,255,.04);color:#888;font-size:.72em;cursor:pointer;font-weight:700;transition:all .25s;backdrop-filter:blur(5px)}
.view-toggle button.active{background:linear-gradient(135deg,rgba(255,203,5,.2),rgba(255,107,53,.1));color:#ffcb05;border-color:rgba(255,203,5,.6);box-shadow:0 0 12px rgba(255,203,5,.15)}

/* Monopoly Board (grid view) */
.board-wrapper{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;max-height:55vh;margin:4px 0;display:flex;justify-content:center}
.board-wrapper.hidden{display:none}
.board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);width:min(95vw,500px);height:min(95vw,500px);min-width:340px;min-height:340px;border:2px solid rgba(255,203,5,.25);border-radius:8px;background:rgba(0,20,40,.7);position:relative;box-shadow:0 0 40px rgba(0,0,0,.4)}
.board-cell{border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:.32em;padding:1px;overflow:hidden;position:relative;cursor:pointer;min-width:0;min-height:0;transition:background .15s}
.board-cell:active{background:rgba(255,255,255,.12)}
.board-cell .cell-color{width:100%;height:22%;min-height:3px;flex-shrink:0}
.board-cell .cell-name{text-align:center;line-height:1.1;flex:1;display:flex;align-items:center;justify-content:center;word-break:break-word;font-size:1em;padding:0 1px}
.board-cell .cell-price{font-size:.85em;color:#ffcb05;flex-shrink:0}
.board-cell .tokens{display:flex;flex-wrap:wrap;gap:0;position:absolute;bottom:0;left:0;right:0;justify-content:center}
.board-cell .tokens img{width:12px;height:12px;image-rendering:pixelated}
.board-cell .cell-buildings{position:absolute;top:0;right:1px;display:flex;gap:0}
.board-cell .cell-buildings .gym{width:5px;height:5px;background:#2ecc71;border-radius:1px}
.board-cell .cell-buildings .stadium{width:7px;height:7px;background:#e74c3c;border-radius:1px}

/* List view */
.list-view{width:100%;max-height:50vh;overflow-y:auto;margin:4px 0;padding:0 2px;-webkit-overflow-scrolling:touch}
.list-view.hidden{display:none}
.list-space{display:flex;align-items:center;gap:7px;padding:7px 10px;margin:3px 0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.list-space:active{background:rgba(255,255,255,.12);transform:scale(.98)}
.list-space.current-space{border-color:rgba(255,203,5,.6);background:linear-gradient(135deg,rgba(255,203,5,.12),rgba(255,107,53,.06));box-shadow:0 0 20px rgba(255,203,5,.15),inset 0 0 20px rgba(255,203,5,.05)}
.list-space .ls-color{width:5px;height:100%;min-height:32px;border-radius:4px;flex-shrink:0;box-shadow:0 0 6px currentColor}
.list-space .ls-sprite{width:28px;height:28px;image-rendering:pixelated;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.list-space .ls-info{flex:1;min-width:0}
.list-space .ls-name{font-size:.82em;font-weight:700;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.list-space .ls-detail{font-size:.65em;color:#999;margin-top:2px;font-weight:500}
.list-space .ls-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.list-space .ls-right .ls-price{font-size:.72em;color:#ffcb05;font-weight:700}
.list-space .ls-right .ls-owner-name{font-size:.65em;font-weight:600;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.08)}
.list-space .ls-right .ls-owner{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.list-space .ls-tokens{display:flex;gap:2px;flex-shrink:0}
.list-space .ls-tokens img{width:20px;height:20px;image-rendering:pixelated;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.list-space .ls-buildings{display:flex;gap:2px;flex-shrink:0;margin-right:2px}
.list-space .ls-buildings .gym{width:7px;height:7px;background:linear-gradient(135deg,#2ecc71,#27ae60);border-radius:2px;box-shadow:0 1px 3px rgba(46,204,113,.3)}
.list-space .ls-buildings .stadium{width:10px;height:10px;background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:3px;box-shadow:0 1px 3px rgba(231,76,60,.3)}
.board-center{grid-column:2/11;grid-row:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8em;color:rgba(255,255,255,.3);text-align:center;padding:8px}
.board-center img{width:60px;opacity:.3}
.board-center .board-title{font-size:1.4em;font-weight:bold;background:linear-gradient(90deg,#ffcb05,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.5}

/* Dice - CSS dot faces */
.dice-container{display:flex;gap:14px;justify-content:center;margin:8px 0;perspective:400px}
.die{width:50px;height:50px;background:linear-gradient(145deg,#fff 0%,#e8e8e8 100%);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;color:#1a1a2e;border:none;box-shadow:0 4px 15px rgba(0,0,0,.3),0 0 0 2px rgba(255,203,5,.4),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.die.rolling{animation:diceRoll3D .12s infinite}
.die .dot{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2c3e50,#1a1a2e);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);justify-self:center;align-self:center;display:none}
@keyframes diceRoll3D{0%{transform:rotateX(0) rotateZ(0) scale(1)}25%{transform:rotateX(20deg) rotateZ(15deg) scale(1.05)}50%{transform:rotateX(0) rotateZ(0) scale(.95)}75%{transform:rotateX(-20deg) rotateZ(-15deg) scale(1.05)}100%{transform:rotateX(0) rotateZ(0) scale(1)}}
@keyframes diceBounce{0%{transform:scale(1) rotateZ(0)}30%{transform:scale(1.15) rotateZ(10deg)}60%{transform:scale(.9) rotateZ(-5deg)}100%{transform:scale(1) rotateZ(0)}}
.die.landed{animation:diceBounce .4s cubic-bezier(.4,0,.2,1)}

/* Message log */
.msg-log{width:100%;max-height:80px;overflow-y:auto;padding:6px 10px;font-size:.75em;background:rgba(0,0,0,.25);border-radius:12px;margin:4px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.05)}
.msg-log p{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);color:#bbb;transition:opacity .3s}
.msg-log p:first-child{color:#fff;font-weight:500}
.msg-log p:last-child{border:none}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:linear-gradient(145deg,rgba(26,26,46,.97),rgba(22,33,62,.97));border:1px solid rgba(255,203,5,.3);border-radius:20px;padding:18px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(255,203,5,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:modalIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{0%{transform:scale(.9) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.modal h3{color:#ffcb05;margin-bottom:10px;text-align:center;font-size:1.15em;font-weight:700;text-shadow:0 0 20px rgba(255,203,5,.2)}
.modal p{font-size:.9em;margin:4px 0;line-height:1.5}
.modal .prop-details{margin:8px 0;padding:10px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.modal .modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* Property panel */
.prop-panel{width:100%;background:rgba(0,0,0,.2);border-radius:12px;padding:8px;margin:4px 0;max-height:120px;overflow-y:auto}
.prop-panel h4{color:#ffcb05;font-size:.8em;margin-bottom:4px}
.prop-item{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;margin:2px;border-radius:8px;font-size:.7em;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:all .15s}
.prop-item .prop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prop-item.mortgaged{opacity:.35;text-decoration:line-through}

/* Trade UI */
.trade-section{margin:8px 0;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.03)}
.trade-section h4{font-size:.85em;color:#ffcb05;margin-bottom:4px;font-weight:700}
.trade-prop-list{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.trade-prop-list label{display:flex;align-items:center;gap:3px;font-size:.75em;padding:4px 8px;background:rgba(255,255,255,.05);border-radius:8px;cursor:pointer;transition:background .15s}
.trade-prop-list label:active{background:rgba(255,255,255,.12)}
.trade-prop-list input[type=checkbox]{accent-color:#ffcb05}
.trade-money-input{width:80px;padding:5px 10px;border:1px solid rgba(255,203,5,.3);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;font-size:.85em;outline:none;transition:border-color .2s}
.trade-money-input:focus{border-color:#ffcb05}

/* Card display */
.card-display{text-align:center;padding:24px 18px;margin:8px 0;border:3px solid #ffcb05;border-radius:20px;background:linear-gradient(145deg,rgba(255,203,5,.08),rgba(255,203,5,.02));position:relative;overflow:hidden}
.card-display::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,203,5,.05),transparent,rgba(255,203,5,.05),transparent);animation:cardShine 4s linear infinite}
@keyframes cardShine{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.card-display.chance-card{border-color:#e040fb;background:linear-gradient(145deg,rgba(224,64,251,.1),rgba(224,64,251,.02))}
.card-display.chance-card::before{background:conic-gradient(from 0deg,transparent,rgba(224,64,251,.05),transparent,rgba(224,64,251,.05),transparent)}
.card-display.chest-card{border-color:#4fc3f7;background:linear-gradient(145deg,rgba(79,195,247,.1),rgba(79,195,247,.02))}
.card-display.chest-card::before{background:conic-gradient(from 0deg,transparent,rgba(79,195,247,.05),transparent,rgba(79,195,247,.05),transparent)}
.card-display .card-icon{font-size:2.8em;margin-bottom:8px;position:relative;z-index:1}
.card-display .card-sprite{width:64px;height:64px;image-rendering:pixelated;margin-bottom:6px;position:relative;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.card-display .card-type{font-size:.8em;color:#ffcb05;text-transform:uppercase;letter-spacing:3px;font-weight:800;margin-bottom:8px;position:relative;z-index:1}
.card-display.chance-card .card-type{color:#e040fb}
.card-display.chest-card .card-type{color:#4fc3f7}
.card-display .card-text{font-size:1.05em;margin:10px 0;color:#eee;line-height:1.6;font-weight:500;position:relative;z-index:1}

/* Player status bar */
.player-status-bar{display:flex;gap:5px;width:100%;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.player-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:12px;font-size:.72em;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);white-space:nowrap;flex-shrink:0;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.player-chip.active-player{border-color:rgba(255,203,5,.5);background:linear-gradient(135deg,rgba(255,203,5,.15),rgba(255,107,53,.05));box-shadow:0 0 15px rgba(255,203,5,.15)}
.player-chip.bankrupt{opacity:.25;text-decoration:line-through;filter:grayscale(1)}
.player-chip img{width:22px;height:22px;image-rendering:pixelated;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.player-chip .chip-money{color:#ffcb05;font-weight:700}

/* Board position progress bar */
.position-bar{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.06);margin:3px 0;display:flex;overflow:hidden;gap:1px;padding:0 1px}
.position-bar .pos-seg{flex:1;height:100%;border-radius:1px;background:rgba(255,255,255,.04);transition:background .3s}
.position-bar .pos-seg.pos-current{background:#ffcb05;box-shadow:0 0 6px rgba(255,203,5,.5)}
.position-bar .pos-seg.pos-owned{background:var(--owner-color);opacity:.6}

/* Landing Card */
.landing-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:90;align-items:flex-end;justify-content:center;padding:0}
.landing-overlay.active{display:flex}
.landing-card{width:100%;max-width:500px;background:linear-gradient(160deg,rgba(20,20,40,.98),rgba(15,30,50,.98));border-top-left-radius:24px;border-top-right-radius:24px;border:1px solid rgba(255,203,5,.2);border-bottom:none;padding:20px 16px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,203,5,.06);animation:landingSlideUp .45s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.landing-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:6px}
@keyframes landingSlideUp{0%{transform:translateY(100%);opacity:.5}100%{transform:translateY(0);opacity:1}}
@keyframes landingFadeOut{0%{transform:translateY(0);opacity:1}100%{transform:translateY(100%);opacity:0}}
.landing-card.dismissing{animation:landingFadeOut .3s cubic-bezier(.4,0,1,1) forwards}
.landing-card .lc-color-bar{height:6px;border-radius:3px;margin:8px 0 12px;width:100%}
.landing-card .lc-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.landing-card .lc-sprite{width:72px;height:72px;image-rendering:pixelated;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.landing-card .lc-title{flex:1}
.landing-card .lc-name{font-size:1.3em;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1.2}
.landing-card .lc-type{font-size:.75em;color:#999;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-top:3px}
.landing-card .lc-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.landing-card .lc-info-item{padding:8px 10px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.06)}
.landing-card .lc-info-label{font-size:.65em;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.landing-card .lc-info-value{font-size:.95em;font-weight:700;color:#ffcb05;margin-top:2px}
.landing-card .lc-owner-info{display:flex;align-items:center;gap:6px}
.landing-card .lc-owner-info img{width:20px;height:20px;image-rendering:pixelated}
.landing-card .lc-buildings{display:flex;gap:4px;margin-top:3px}
.landing-card .lc-buildings .lc-gym{width:12px;height:12px;background:linear-gradient(135deg,#2ecc71,#27ae60);border-radius:3px;box-shadow:0 1px 4px rgba(46,204,113,.3)}
.landing-card .lc-buildings .lc-stadium{width:16px;height:16px;background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:4px;box-shadow:0 1px 4px rgba(231,76,60,.3)}
.landing-card .lc-neighbors{display:flex;gap:6px;margin-top:12px;justify-content:center}
.landing-card .lc-neighbor{padding:5px 8px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid rgba(255,255,255,.06);text-align:center;flex:1;max-width:120px}

/* Floating particles */

@keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.15}90%{opacity:.15}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function initSetup(){

      <div class="pokemon-select" id="psel-${i}"></div>`;
    container.appendChild(sec);

    document.getElementById(`pname-${i}`).oninput=e=>{setupData[i].name=e.target.value;checkReady()};

    const grid=document.getElementById(`psel-${i}`);
    TOKEN_OPTIONS.forEach(tk=>{
      const d=document.createElement('div');
      const isTaken=takenTokens.includes(tk.id)&&setupData[i].token!==tk.id;

        if(isTaken)return;
        setupData[i].token=tk.id;
        initSetup();
      };
      grid.appendChild(d);
    });
  }
  checkReady();
}

function checkReady(){
  const ready = Array.from({length:playerCount}).every((_,i)=>setupData[i].name.trim()&&setupData[i].token!==null);
  document.getElementById('start-game-btn').disabled=!ready;
}

document.getElementById('start-game-btn').onclick=()=>{

      token:setupData[i].token,

      inJail:false,
      jailTurns:0,
      jailCards:0,
      bankrupt:false

  doublesCount=0;

};

  for(let i=0;i<40;i++){

    else if(BOARD[i].owner>=0){

      seg.style.setProperty('--owner-color',players[BOARD[i].owner].color);
    }
    bar.appendChild(seg);
  }
}

// Board position mapping: maps board index to grid [col, row] (0-indexed, 0=top-left)
function getBoardPosition(idx){
  if(idx>=0&&idx<=10) return [10-idx,10]; // bottom row, right to left
  if(idx>=11&&idx<=19) return [0,10-(idx-10)]; // left column, bottom to top
  if(idx>=20&&idx<=30) return [idx-20,0]; // top row, left to right
  if(idx>=31&&idx<=39) return [10,idx-30]; // right column, top to bottom
  return [0,0];
}

function renderBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';

  // Create 11x11 grid
  const cells=new Map();
  for(let i=0;i<40;i++){
    const [c,r]=getBoardPosition(i);
    cells.set(`${c},${r}`,i);
  }

  for(let r=0;r<11;r++){
    for(let c=0;c<11;c++){
      const key=`${c},${r}`;
      if(cells.has(key)){
        const idx=cells.get(key);
        const sp=BOARD[idx];
        const cell=document.createElement('div');
        cell.className='board-cell';
        cell.style.gridColumn=c+1;
        cell.style.gridRow=r+1;

        let html='';
        // Color bar for properties
        if(sp.group){
          html+=`<div class="cell-color" style="background:${GROUP_COLORS[sp.group]}"></div>`;
        }

        // Shortened name
        let shortName=sp.name;
        if(shortName.length>14) shortName=shortName.substring(0,12)+'…';
        html+=`<div class="cell-name">${shortName}</div>`;

        // Price
        if(sp.price&&sp.owner===-1){
          html+=`<div class="cell-price">${sp.price}₽</div>`;
        } else if(sp.owner>=0){
          html+=`<div class="cell-price" style="color:${players[sp.owner].color}">●</div>`;
        }

        // Buildings
        if(sp.buildings>0){
          html+='<div class="cell-buildings">';
          if(sp.buildings===5){
            html+='<div class="stadium"></div>';
          } else {
            for(let b=0;b<sp.buildings;b++) html+='<div class="gym"></div>';
          }
          html+='</div>';
        }

        // Player tokens on this space
        let tokensHtml='<div class="tokens">';
        players.forEach((p,pi)=>{
          if(!p.bankrupt&&p.position===idx){
            tokensHtml+=`<img src="${SPRITE_URL(p.token)}" title="${p.name}">`;
          }
        });
        tokensHtml+='</div>';
        html+=tokensHtml;

        cell.innerHTML=html;
        cell.onclick=()=>showSpaceInfo(idx);

        // Highlight current player's space
        if(players[currentPlayer]&&players[currentPlayer].position===idx&&!players[currentPlayer].bankrupt){
          cell.style.background='rgba(255,203,5,.15)';
        }

        // Highlight if mortgaged
        if(sp.mortgaged){
          cell.style.opacity='.5';
        }

        board.appendChild(cell);
      } else if(r>=1&&r<=9&&c>=1&&c<=9){
        // Center area - only create once
      }
    }
  }

  // Add center
  const center=document.createElement('div');
  center.className='board-center';
  center.innerHTML=`<div class="board-title">Pokémon<br>Monopoly</div><div style="margin-top:6px;font-size:.7em">Free Parking Pot: ${freeParkingPot}₽</div>`;
  board.appendChild(center);
}

// ==================== DICE ====================
function rollDice(){
  if(gamePhase!=='rolling')return;
  const cp=players[currentPlayer];
  if(cp.money<0){handleDebt(currentPlayer,-1,0);return;}

  // Jail logic
  if(cp.inJail){
    animateDice(()=>{
      const d1=lastDice[0],d2=lastDice[1];
      if(d1===d2){
        cp.inJail=false;
        cp.jailTurns=0;
        logMsg(`${cp.name} rolled doubles and escaped Team Rocket Hideout!`);
        movePlayer(currentPlayer,d1+d2);
      } else {
        cp.jailTurns++;
        if(cp.jailTurns>=3){
          cp.inJail=false;
          cp.jailTurns=0;
          takeMoney(currentPlayer,50);
          logMsg(`${cp.name} paid 50₽ to escape Team Rocket Hideout.`);
          movePlayer(currentPlayer,d1+d2);
        } else {
          logMsg(`${cp.name} didn't roll doubles. Turn ${cp.jailTurns}/3 in hideout.`);
          gamePhase='turnend';
          renderAll();
        }
      }
    });
    return;
  }

  animateDice(()=>{
    const d1=lastDice[0],d2=lastDice[1];
    if(d1===d2){
      doublesCount++;
      if(doublesCount>=3){
        logMsg(`${cp.name} rolled 3 doubles in a row! Caught by Team Rocket!`);
        goToJail(currentPlayer);
        return;
      }
      logMsg(`${cp.name} rolled doubles (${d1}+${d2})! Roll again after.`);
    } else {
      doublesCount=0;
    }
    movePlayer(currentPlayer,d1+d2);
  });
}

// Dice dot patterns: which grid positions (1-9) to show for each value
const DICE_DOTS = {
  1: [5],
  2: [3,7],
  3: [3,5,7],
  4: [1,3,7,9],
  5: [1,3,5,7,9],
  6: [1,3,4,6,7,9]
};

function setDieFace(el, value){
  el.innerHTML='';
  for(let i=1;i<=9;i++){
    const dot=document.createElement('div');
    dot.className='dot';
    if(DICE_DOTS[value]&&DICE_DOTS[value].includes(i)) dot.style.display='block';
    el.appendChild(dot);
  }
}

function animateDice(callback){
  const die1El=document.getElementById('die1');
  const die2El=document.getElementById('die2');
  die1El.classList.add('rolling');
  die2El.classList.add('rolling');
  die1El.classList.remove('landed');
  die2El.classList.remove('landed');
  let count=0;
  const iv=setInterval(()=>{
    setDieFace(die1El,Math.ceil(Math.random()*6));
    setDieFace(die2El,Math.ceil(Math.random()*6));
    count++;
    if(count>12){
      clearInterval(iv);
      die1El.classList.remove('rolling');
      die2El.classList.remove('rolling');
      lastDice=[Math.ceil(Math.random()*6),Math.ceil(Math.random()*6)];
      setDieFace(die1El,lastDice[0]);
      setDieFace(die2El,lastDice[1]);
      die1El.classList.add('landed');
      die2El.classList.add('landed');
      setTimeout(callback,300);
    }
  },70);
}

// Initialize dice faces on load
function initDiceFaces(){
  setDieFace(document.getElementById('die1'),1);
  setDieFace(document.getElementById('die2'),1);
}

// ==================== MOVEMENT ====================
function movePlayer(pi, steps){
  const p=players[pi];
  const oldPos=p.position;
  const newPos=(oldPos+steps)%40;

  // Check if passing GO
  if(newPos<oldPos&&steps>0){
    giveMoney(pi,200);
    logMsg(`${p.name} passed Pokémon League Start! +200₽`);
  }

  p.position=newPos;
  logMsg(`${p.name} landed on ${BOARD[newPos].name}`);
  renderAll();
  showLandingCard(pi, newPos, ()=>handleLanding(pi));
}

function moveToSpace(pi, target, collectGo){
  const p=players[pi];
  if(collectGo&&target<=p.position&&target!==p.position){
    giveMoney(pi,200);
    logMsg(`${p.name} passed Pokémon League Start! +200₽`);
  }
  p.position=target;
  renderAll();
  showLandingCard(pi, target, ()=>handleLanding(pi));
}

function dismissLandingCard(){

      landingCardCallback=null;
      cb();
    }
  },300);
}

function getSpaceTypeName(sp){
  const types={property:'Property',railroad:'Pokémon Center',utility:'Utility',tax:'Tax',
    chance:'Wild Encounter',chest:"Professor's Gift",go:'Start',jail:'Jail',
    gotojail:'Go to Jail',freeparking:'Free Parking'};
  if(sp.group){
    const groupNames={brown:'Kanto Starter',lightblue:'Kanto',pink:'Johto',orange:'Hoenn',
      red:'Sinnoh',yellow:'Unova',green:'Kalos',darkblue:'Elite Four'};
    return groupNames[sp.group]||'Property';
  }
  return types[sp.type]||'Space';
}

// ==================== LANDING LOGIC ====================
function handleLanding(pi){
  const p=players[pi];
  const sp=BOARD[p.position];

  switch(sp.type){
    case 'property':
    case 'railroad':
    case 'utility':
      if(sp.owner===-1){
        offerPurchase(pi);
      } else if(sp.owner!==pi&&!sp.mortgaged){
        chargeRent(pi);
      } else {
        finishLanding();
      }
      break;
    case 'tax':
      if(sp.name.includes('Entry Fee')){
        // Income tax: 200 or 10%
        const tenPct=Math.floor(p.money*0.1);
        const taxAmt=Math.min(200,tenPct);
        takeMoney(pi,200);
        freeParkingPot+=200;
        logMsg(`${p.name} pays League Entry Fee: 200₽`);
      } else {
        takeMoney(pi,sp.amount);
        freeParkingPot+=sp.amount;
        logMsg(`${p.name} pays ${sp.name}: ${sp.amount}₽`);
      }
      if(p.money<0){
        handleDebt(pi,-1,0);
      } else {
        finishLanding();
      }
      break;
    case 'chance':
      drawCard(pi,'chance');
      break;
    case 'chest':
      drawCard(pi,'chest');
      break;
    case 'gotojail':
      goToJail(pi);
      break;
    case 'freeparking':
      if(freeParkingPot>0){
        logMsg(`${p.name} collects ${freeParkingPot}₽ from Pokémon Daycare!`);
        giveMoney(pi,freeParkingPot);
        freeParkingPot=0;
      }
      finishLanding();
      break;
    case 'jail':
    case 'go':
    default:
      finishLanding();
      break;
  }
}

function finishLanding(){
  const cp=players[currentPlayer];
  if(cp.bankrupt){
    gamePhase='turnend';
    endTurn();
    return;
  }
  if(doublesCount>0&&!cp.inJail){
    gamePhase='rolling';
    logMsg(`${cp.name} gets another roll (doubles)!`);
  } else {
    gamePhase='turnend';
  }
  renderAll();
  checkWin();
}

// ==================== PROPERTY PURCHASE ====================
function offerPurchase(pi){
  const p=players[pi];
  const sp=BOARD[p.position];
  if(p.money>=sp.price){
    document.getElementById('buy-btn').style.display='';
    document.getElementById('buy-btn').textContent=`Buy (${sp.price}₽)`;
    document.getElementById('auction-btn').style.display='';
    gamePhase='buying';
  } else {
    logMsg(`${p.name} can't afford ${sp.name} (${sp.price}₽).`);
    finishLanding();
  }
}

function buyProperty(){
  const p=players[currentPlayer];
  const sp=BOARD[p.position];
  p.money-=sp.price;
  sp.owner=currentPlayer;
  p.properties.push(p.position);
  logMsg(`${p.name} bought ${sp.name} for ${sp.price}₽!`);
  document.getElementById('buy-btn').style.display='none';
  document.getElementById('auction-btn').style.display='none';
  finishLanding();
}

function declinePurchase(){
  logMsg(`${players[currentPlayer].name} passed on ${BOARD[players[currentPlayer].position].name}.`);
  document.getElementById('buy-btn').style.display='none';
  document.getElementById('auction-btn').style.display='none';
  finishLanding();
}

// ==================== RENT ====================
function chargeRent(pi){
  const p=players[pi];
  const sp=BOARD[p.position];
  const owner=players[sp.owner];
  let rent=0;

  if(sp.type==='property'){
    rent=sp.rent[sp.buildings];
    // Double rent for full group with no buildings
    if(sp.buildings===0&&ownsFullGroup(sp.owner,sp.group)){
      rent*=2;
    }
  } else if(sp.type==='railroad'){
    const rrCount=countRailroads(sp.owner);
    rent=[0,25,50,100,200][rrCount];
  } else if(sp.type==='utility'){
    const utilCount=countUtilities(sp.owner);
    const diceTotal=lastDice[0]+lastDice[1];
    rent=utilCount===1?diceTotal*4:diceTotal*10;
  }

  logMsg(`${p.name} pays ${rent}₽ rent to ${owner.name} for ${sp.name}`);
  p.money-=rent;
  owner.money+=rent;

  if(p.money<0){
    handleDebt(pi,sp.owner,rent);
  } else {
    finishLanding();
  }
}

function ownsFullGroup(playerIdx,group){
  return GROUP_MEMBERS[group].every(i=>BOARD[i].owner===playerIdx);
}

function countRailroads(playerIdx){
  return [5,15,25,35].filter(i=>BOARD[i].owner===playerIdx).length;
}

function countUtilities(playerIdx){

// ==================== CARDS ====================
function drawCard(pi,type){
  const deck=type==='chance'?chanceDeck:chestDeck;
  const cards=type==='chance'?CHANCE_CARDS:CHEST_CARDS;
  if(deck.length===0){
    // Reshuffle
    for(let i=0;i<cards.length;i++) deck.push(i);
    shuffleArray(deck);
  }
  const cardIdx=deck.shift();
  const card=cards[cardIdx];

  const isChance=type==='chance';
  const cardClass=isChance?'chance-card':'chest-card';
  const typeName=isChance?'Wild Encounter':"Professor's Gift";
  const cardSprite=isChance?63:175; // Abra for chance, Togepi for chest

  showModal(`
    <div class="card-display ${cardClass}">
      <img class="card-sprite" src="${SPRITE_URL(cardSprite)}" alt="">
      <div class="card-type">${typeName}</div>
      <div class="card-text">${card.text}</div>
    </div>
    <p style="text-align:center;color:#888;font-size:.75em;margin:4px 0">${players[pi].name} drew this card</p>
    <div class="modal-actions">
      <button class="btn" onclick="executeCard(${pi},'${type}',${cardIdx})">OK</button>
    </div>
  `);
}

function executeCard(pi,type,cardIdx){
  closeModal();
  const card=(type==='chance'?CHANCE_CARDS:CHEST_CARDS)[cardIdx];
  card.action(pi);
  if(players[pi].money<0){
    handleDebt(pi,-1,0);
  } else {
    // If the card moved the player, handleLanding already called via moveToSpace
    // Only finishLanding if card didn't move player
    if(!card.text.includes('Advance')&&!card.text.includes('Go back')&&!card.text.includes('Go directly')&&!card.text.includes('Fly')&&!card.text.includes('Surf')&&!card.text.includes('fell')){
      finishLanding();
    }
  }
}

// ==================== DEBT / BANKRUPTCY ====================
function handleDebt(pi, creditor, amount){
  const p=players[pi];
  modalLocked=true; // prevent dismissing debt modal
  // Check if player has anything to mortgage
  const canMortgage=p.properties.some(idx=>!BOARD[idx].mortgaged&&BOARD[idx].buildings===0);
  const canSellBuildings=p.properties.some(idx=>BOARD[idx].buildings>0);

  if(!canMortgage&&!canSellBuildings){
    // Nothing to do, forced bankruptcy
    showModal(`
      <h3>${p.name} is Bankrupt!</h3>
      <p style="color:#e74c3c">Balance: ${p.money}₽</p>
      <p>No properties to mortgage. ${p.name} is out of the game!</p>
      <div class="modal-actions">
        <button class="btn small danger" onclick="goBankrupt(${pi},${creditor})">OK</button>
      </div>
    `);
    return;
  }

  showModal(`
    <h3>⚠️ ${p.name} is in Debt!</h3>
    <p style="color:#e74c3c;font-size:1.1em;font-weight:bold">Balance: ${p.money}₽</p>
    <p>You must raise funds by mortgaging properties or selling buildings, or declare bankruptcy!</p>
    <div class="modal-actions">
      ${canSellBuildings?'<button class="btn small" onclick="debtSellBuildingMenu('+pi+','+creditor+')">Sell Buildings</button>':''}
      ${canMortgage?'<button class="btn small" onclick="debtMortgageMenu('+pi+','+creditor+')">Mortgage Properties</button>':''}
      <button class="btn small danger" onclick="goBankrupt(${pi},${creditor})">Declare Bankruptcy</button>
    </div>
  `);
}

function debtSellBuildingMenu(pi, creditor){
  const p=players[pi];
  const sellable=p.properties.filter(idx=>BOARD[idx].buildings>0);
  if(sellable.length===0){
    handleDebt(pi,creditor,0);
    return;
  }
  let html=`<h3>Sell Buildings</h3><p style="color:${p.money<0?'#e74c3c':'#ffcb05'}">Balance: ${p.money}₽</p><div style="max-height:200px;overflow-y:auto">`;
  sellable.forEach(idx=>{
    const sp=BOARD[idx];
    const val=Math.floor(sp.buildCost/2);
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px;margin:3px 0;background:rgba(255,255,255,.05);border-radius:6px">
      <div><span style="font-size:.85em">${sp.name}</span><br><span style="font-size:.7em;color:#aaa">${sp.buildings} building(s)</span></div>
      <button class="btn small" onclick="sellBuildingForDebt(${idx},${pi},${creditor})">+${val}₽</button>
    </div>`;
  });
  html+=`</div><div class="modal-actions">
    <button class="btn small" onclick="handleDebt(${pi},${creditor},0)">Back</button>
  </div>`;
  showModal(html);
}

function sellBuildingForDebt(propIdx, pi, creditor){
  const sp=BOARD[propIdx];
  const val=Math.floor(sp.buildCost/2);
  players[pi].money+=val;
  sp.buildings--;
  logMsg(`${players[pi].name} sold a building on ${sp.name} (+${val}₽)`);
  renderAll();
  if(players[pi].money>=0){
    debtResolved();
  } else {
    debtSellBuildingMenu(pi,creditor);
  }
}

function debtMortgageMenu(pi, creditor){
  const p=players[pi];
  const mortgageable=p.properties.filter(idx=>!BOARD[idx].mortgaged&&BOARD[idx].buildings===0);
  if(mortgageable.length===0){
    const canSell=p.properties.some(idx=>BOARD[idx].buildings>0);
    if(canSell){
      handleDebt(pi,creditor,0);
    } else {
      showModal(`<h3>No Properties to Mortgage</h3><p>You must declare bankruptcy.</p>
        <div class="modal-actions"><button class="btn small danger" onclick="goBankrupt(${pi},${creditor})">Declare Bankruptcy</button></div>`);
    }
    return;
  }
  let html=`<h3>Mortgage Properties</h3><p style="color:${p.money<0?'#e74c3c':'#ffcb05'}">Balance: ${p.money}₽</p><div style="max-height:200px;overflow-y:auto">`;
  mortgageable.forEach(idx=>{
    const sp=BOARD[idx];
    const val=Math.floor(sp.price/2);
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px;margin:3px 0;background:rgba(255,255,255,.05);border-radius:6px">
      <span style="font-size:.85em">${sp.name}</span>
      <button class="btn small" onclick="mortgageForDebt(${idx},${pi},${creditor})">+${val}₽</button>
    </div>`;
  });
  html+=`</div><div class="modal-actions">
    ${p.money>=0?`<button class="btn small success" onclick="debtResolved()">Done</button>`:''}
    <button class="btn small" onclick="handleDebt(${pi},${creditor},0)">Back</button>
    <button class="btn small danger" onclick="goBankrupt(${pi},${creditor})">Declare Bankruptcy</button>

  showModal(html);
}

function mortgageForDebt(propIdx, pi, creditor){
  const sp=BOARD[propIdx];
  sp.mortgaged=true;
  players[pi].money+=Math.floor(sp.price/2);
  logMsg(`${players[pi].name} mortgaged ${sp.name} for ${Math.floor(sp.price/2)}₽`);
  renderAll();
  if(players[pi].money>=0){
    debtResolved();
  } else {
    debtMortgageMenu(pi,creditor);
  }
}

function debtResolved(){
  modalLocked=false;
  closeModal();
  finishLanding();
}

function goBankrupt(pi, creditor){
  modalLocked=false;
  closeModal();
  const p=players[pi];
  p.bankrupt=true;
  logMsg(`${p.name} went bankrupt!`);

  // Transfer properties
  p.properties.forEach(idx=>{
    if(creditor>=0){
      BOARD[idx].owner=creditor;
      players[creditor].properties.push(idx);
    } else {
      BOARD[idx].owner=-1;
      BOARD[idx].buildings=0;
      BOARD[idx].mortgaged=false;
    }
  });
  if(creditor>=0){
    players[creditor].money+=Math.max(0,p.money);
  }
  p.properties=[];
  p.money=0;

  renderAll();
  checkWin();
  if(gamePhase!=='gameover'){
    finishLanding();
  }
}

function checkWin(){
  const alive=players.filter(p=>!p.bankrupt);
  if(alive.length===1){
    gamePhase='gameover';
    document.getElementById('board-screen').classList.remove('active');
    document.getElementById('win-screen').classList.add('active');
    if(window.GK)GK.confetti();
    document.getElementById('win-msg').innerHTML=`
      <img src="${SPRITE_URL(alive[0].token)}" style="width:80px;height:80px;image-rendering:pixelated"><br>
      <h2 style="color:${alive[0].color};margin:8px 0">${alive[0].name} Wins!</h2>
      <p style="color:#ffcb05">Champion of the Pokémon Monopoly League!</p>
      <p style="color:#aaa;font-size:.85em">Final wealth: ${alive[0].money}₽</p>
    `;
  }
}

// ==================== TURN MANAGEMENT ====================
function endTurn(){
  if(gamePhase!=='turnend')return;
  const cp=players[currentPlayer];
  if(cp.money<0){handleDebt(currentPlayer,-1,0);return;}
  doublesCount=0;
  // Next non-bankrupt player
  do {
    currentPlayer=(currentPlayer+1)%players.length;
  } while(players[currentPlayer].bankrupt);

  gamePhase='rolling';
  logMsg(`--- ${players[currentPlayer].name}'s turn ---`);

  if(players[currentPlayer].inJail){
    renderAll();
    showJailOptions();
  } else {
    renderAll();
  }
}

// ==================== BUILDING ====================
function openBuildMenu(){
  const p=players[currentPlayer];
  // Find groups where player owns all properties
  const buildable=[];
  Object.keys(GROUP_MEMBERS).forEach(group=>{
    if(ownsFullGroup(currentPlayer,group)){
      GROUP_MEMBERS[group].forEach(idx=>{
        const sp=BOARD[idx];
        if(!sp.mortgaged&&sp.buildings<5){
          // Check even building rule (within 1 of others in group)
          const minB=Math.min(...GROUP_MEMBERS[group].map(i=>BOARD[i].buildings));
          if(sp.buildings<=minB){
            buildable.push(idx);
          }
        }
      });
    }
  });

  if(buildable.length===0){
    showModal(`<h3>Build</h3><p>No properties available to build on. You need complete color groups with no mortgaged properties.</p>
      <div class="modal-actions"><button class="btn small" onclick="closeModal()">OK</button></div>`);
    return;
  }

  let html='<h3>Build Gyms & Stadiums</h3><p>Balance: '+p.money+'₽</p><div style="max-height:250px;overflow-y:auto">';
  buildable.forEach(idx=>{
    const sp=BOARD[idx];
    const cost=sp.buildCost;
    const bType=sp.buildings===4?'Stadium':'Gym';
    const canAfford=p.money>=cost;
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px;margin:3px 0;background:rgba(255,255,255,.05);border-radius:6px">
      <div>
        <div style="font-size:.85em">${sp.name}</div>
        <div style="font-size:.7em;color:#aaa">${sp.buildings}/5 built • ${bType}: ${cost}₽</div>
      </div>
      <button class="btn small" ${canAfford?'':`disabled`} onclick="buildOn(${idx})">Build</button>
    </div>`;
  });
  html+=`</div><div class="modal-actions"><button class="btn small" onclick="closeModal()">Done</button></div>`;
  showModal(html);
}

function buildOn(idx){
  const sp=BOARD[idx];
  const p=players[currentPlayer];
  if(p.money<sp.buildCost)return;
  p.money-=sp.buildCost;
  sp.buildings++;
  const bName=sp.buildings===5?'a Stadium':'a Gym';
  logMsg(`${p.name} built ${bName} on ${sp.name} (-${sp.buildCost}₽)`);
  renderAll();
  openBuildMenu(); // Refresh menu

function openTradeWith(otherIdx){
  const cp=players[currentPlayer];
  const op=players[otherIdx];

  let html=`<h3>Trade with ${op.name}</h3>
    <div class="trade-section">
      <h4 style="color:${cp.color}">${cp.name} Offers:</h4>
      <div>Money: <input type="number" class="trade-money-input" id="trade-offer-money" value="0" min="0" max="${cp.money}">₽</div>
      <div class="trade-prop-list" id="trade-offer-props">`;

    if(sp.buildings===0){
      html+=`<label><input type="checkbox" value="${idx}"> ${sp.name}</label>`;
    }
  });
  html+=`</div></div>
    <div class="trade-section">
      <h4 style="color:${op.color}">${op.name} Gives:</h4>
      <div>Money: <input type="number" class="trade-money-input" id="trade-request-money" value="0" min="0" max="${op.money}">₽</div>
      <div class="trade-prop-list" id="trade-request-props">`;
  op.properties.forEach(idx=>{
    const sp=BOARD[idx];
    if(sp.buildings===0){
      html+=`<label><input type="checkbox" value="${idx}"> ${sp.name}</label>`;
    }
  });
  html+=`</div></div>
    <div class="modal-actions">
      <button class="btn small success" onclick="proposeTrade(${otherIdx})">Propose</button>
      <button class="btn small" onclick="closeModal()">Cancel</button>
    </div>`;
  showModal(html);
}

function proposeTrade(otherIdx){
  const offerMoney=parseInt(document.getElementById('trade-offer-money').value)||0;
  const requestMoney=parseInt(document.getElementById('trade-request-money').value)||0;
  const offerProps=Array.from(document.querySelectorAll('#trade-offer-props input:checked')).map(el=>parseInt(el.value));
  const requestProps=Array.from(document.querySelectorAll('#trade-request-props input:checked')).map(el=>parseInt(el.value));

  if(offerMoney===0&&requestMoney===0&&offerProps.length===0&&requestProps.length===0){
    return;
  }

  const cp=players[currentPlayer];
  const op=players[otherIdx];

  let desc=`<h3>Trade Proposal</h3>
    <p><strong style="color:${cp.color}">${cp.name}</strong> offers:</p>
    <ul style="font-size:.85em;padding-left:16px">`;
  if(offerMoney>0) desc+=`<li>${offerMoney}₽</li>`;
  offerProps.forEach(idx=>desc+=`<li>${BOARD[idx].name}</li>`);
  desc+=`</ul><p><strong style="color:${op.color}">${op.name}</strong> gives:</p>
    <ul style="font-size:.85em;padding-left:16px">`;
  if(requestMoney>0) desc+=`<li>${requestMoney}₽</li>`;
  requestProps.forEach(idx=>desc+=`<li>${BOARD[idx].name}</li>`);
  desc+=`</ul>
    <p style="color:#ffcb05;font-size:.9em;margin-top:8px">Pass the device to ${op.name}!</p>
    <div class="modal-actions">
      <button class="btn small success" onclick="executeTrade(${otherIdx},${offerMoney},${requestMoney},${JSON.stringify(offerProps)},${JSON.stringify(requestProps)})">Accept</button>
      <button class="btn small danger" onclick="closeModal()">Decline</button>
    </div>`;
  showModal(desc);
}

function executeTrade(otherIdx, offerMoney, requestMoney, offerProps, requestProps){
  const cp=players[currentPlayer];
  const op=players[otherIdx];

  // Transfer money
  cp.money-=offerMoney;
  cp.money+=requestMoney;
  op.money+=offerMoney;
  op.money-=requestMoney;

  // Transfer properties
  offerProps.forEach(idx=>{
    BOARD[idx].owner=otherIdx;
    cp.properties=cp.properties.filter(i=>i!==idx);
    op.properties.push(idx);
  });
  requestProps.forEach(idx=>{
    BOARD[idx].owner=currentPlayer;
    op.properties=op.properties.filter(i=>i!==idx);
    cp.properties.push(idx);
  });

  logMsg(`Trade completed between ${cp.name} and ${op.name}!`);
  closeModal();
  renderAll();
}

      <p>With Stadium: ${sp.rent[5]}₽</p>
      <p>Gym cost: ${sp.buildCost}₽ each</p>
      <p>Mortgage: ${Math.floor(sp.price/2)}₽</p>
      ${sp.owner>=0?`<p>Owner: <span style="color:${players[sp.owner].color}">${players[sp.owner].name}</span></p>`:'<p>Unowned</p>'}
      ${sp.buildings>0?`<p>Buildings: ${sp.buildings===5?'Stadium':sp.buildings+' Gym(s)'}</p>`:''}
      ${sp.mortgaged?'<p style="color:#e74c3c">MORTGAGED</p>':''}
    </div>`;
  } else if(sp.type==='railroad'){
    html+=`<div class="prop-details">
      <p>Price: 200₽</p>
      <p>Rent with 1: 25₽</p>
      <p>Rent with 2: 50₽</p>
      <p>Rent with 3: 100₽</p>
      <p>Rent with 4: 200₽</p>
      ${sp.owner>=0?`<p>Owner: <span style="color:${players[sp.owner].color}">${players[sp.owner].name}</span></p>`:'<p>Unowned</p>'}
    </div>`;
  } else if(sp.type==='utility'){
    html+=`<div class="prop-details">
      <p>Price: 150₽</p>
      <p>1 owned: Dice × 4</p>
      <p>2 owned: Dice × 10</p>
      ${sp.owner>=0?`<p>Owner: <span style="color:${players[sp.owner].color}">${players[sp.owner].name}</span></p>`:'<p>Unowned</p>'}
    </div>`;
  }

  // Show players on this space
  const here=players.filter((p,i)=>!p.bankrupt&&p.position===idx);
  if(here.length>0){
    html+='<p style="font-size:.8em;color:#aaa;margin-top:4px">Players here: '+here.map(p=>`<span style="color:${p.color}">${p.name}</span>`).join(', ')+'</p>';
  }

  html+=`<div class="modal-actions"><button class="btn small" onclick="closeModal()">Close</button></div>`;
  showModal(html);
}

function showPlayerInfo(pi){
  const p=players[pi];
  let html=`<h3 style="color:${p.color}"><img src="${SPRITE_URL(p.token)}" style="width:32px;height:32px;image-rendering:pixelated;vertical-align:middle"> ${p.name}</h3>
    <p>Money: <span style="color:#ffcb05">${p.money}₽</span></p>
    <p>Position: ${BOARD[p.position].name}</p>
    ${p.inJail?'<p style="color:#e74c3c">In Team Rocket Hideout!</p>':''}
    ${p.jailCards>0?`<p>Get Out Free Cards: ${p.jailCards}</p>`:''}
    <h4 style="color:#ffcb05;font-size:.85em;margin:8px 0 4px">Properties:</h4>`;

  if(p.properties.length===0){
    html+='<p style="font-size:.85em;color:#aaa">None</p>';
  } else {
    p.properties.forEach(idx=>{
      const sp=BOARD[idx];
      html+=`<div class="prop-item ${sp.mortgaged?'mortgaged':''}">`;
      if(sp.group) html+=`<span class="prop-dot" style="background:${GROUP_COLORS[sp.group]}"></span>`;
      html+=`${sp.name}`;
      if(sp.buildings>0) html+=` (${sp.buildings===5?'Stadium':sp.buildings+'G'})`;
      html+=`</div>`;
    });
  }

  // Net worth
  let netWorth=p.money;
  p.properties.forEach(idx=>{
    const sp=BOARD[idx];
    netWorth+=sp.mortgaged?Math.floor(sp.price/2):sp.price;
    netWorth+=sp.buildings*sp.buildCost;
  });
  html+=`<p style="margin-top:8px;font-size:.85em">Net Worth: <span style="color:#ffcb05">${netWorth}₽</span></p>`;

  html+=`<div class="modal-actions"><button class="btn small" onclick="closeModal()">Close</button></div>`;
  showModal(html);
}

// ==================== UTILITIES ====================
function giveMoney(pi, amount){
  players[pi].money+=amount;
}

function takeMoney(pi, amount){
  players[pi].money-=amount;
  if(players[pi].money<0){
    // Will be handled by caller
  }
}

function logMsg(msg){
  const log=document.getElementById('msg-log');
  const p=document.createElement('p');
  p.textContent=msg;
  log.prepend(p);
  // Keep max 20 messages
  while(log.children.length>20) log.removeChild(log.lastChild);
}

function showModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal(){
  if(modalLocked) return;
  document.getElementById('modal-overlay').classList.remove('active');
}

// Close modal on overlay click (not on modal itself)
document.getElementById('modal-overlay').addEventListener('click',e=>{
  if(modalLocked) return;
  if(e.target===document.getElementById('modal-overlay')) closeModal();
});

// ==================== PARTICLES ====================
function initParticles(){
  const container=document.getElementById('particles');
  if(!container)return;
  const symbols=['●','◆','★'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=symbols[i%symbols.length];
    p.style.left=Math.random()*100+'%';
    p.style.fontSize=(6+Math.random()*10)+'px';
    p.style.color=`hsl(${40+Math.random()*20},100%,${50+Math.random()*20}%)`;
    p.style.animationDuration=(12+Math.random()*18)+'s';
    p.style.animationDelay=(-Math.random()*20)+'s';
    container.appendChild(p);
  }
}

function confirmNewGame(){
  showModal(`<h3>Start New Game?</h3>
    <p>This will end the current game. Are you sure?</p>
    <div class="modal-actions">
      <button class="btn small danger" onclick="clearSave();location.reload()">Yes, New Game</button>
      <button class="btn small" onclick="closeModal()">Cancel</button>
    </div>`);
}

// ==================== SAVE / RESTORE ====================
const SAVE_KEY='pokemon_monopoly_save';

function saveGame(){
  if(gamePhase==='setup'||gamePhase==='gameover')return;
  const state={
    players:players.map(p=>({...p})),
    currentPlayer,
    gamePhase,
    doublesCount,
    lastDice:[...lastDice],
    freeParkingPot,
    boardState:BOARD.map(sp=>({owner:sp.owner,buildings:sp.buildings,mortgaged:sp.mortgaged})),
    chestDeck:[...chestDeck],
    chanceDeck:[...chanceDeck],
    currentView
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const state=JSON.parse(raw);
    if(!state||!state.players||state.players.length<2)return false;

    players=state.players;
    currentPlayer=state.currentPlayer;
    gamePhase=state.gamePhase;
    doublesCount=state.doublesCount;
    lastDice=state.lastDice||[0,0];
    freeParkingPot=state.freeParkingPot||0;
    chestDeck=state.chestDeck||[];
    chanceDeck=state.chanceDeck||[];
    currentView=state.currentView||'list';

    // Restore board ownership/buildings
    if(state.boardState){
      state.boardState.forEach((bs,i)=>{
        BOARD[i].owner=bs.owner;
        BOARD[i].buildings=bs.buildings;
        BOARD[i].mortgaged=bs.mortgaged;
      });
    }

    // If decks are empty, reinit
    if(chestDeck.length===0) chestDeck=shuffleArray([...Array(CHEST_CARDS.length).keys()]);
    if(chanceDeck.length===0) chanceDeck=shuffleArray([...Array(CHANCE_CARDS.length).keys()]);

    return true;
  }catch(e){return false}
}

function clearSave(){
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
}

// Hook into key functions to auto-save after state changes
const _origRenderAll=renderAll;
renderAll=function(){
  _origRenderAll();
  saveGame();
};

// ==================== INIT ====================
initParticles();

// Try to restore a saved game
if(loadGame()){
  // Restored! Switch to board screen
  document.getElementById('setup-screen').classList.remove('active');
  document.getElementById('board-screen').classList.add('active');
  setView(currentView);
  renderAll();
  logMsg('Game restored from save!');

  // If we were in the middle of buying, re-show the buttons
  if(gamePhase==='buying'){
    const sp=BOARD[players[currentPlayer].position];
    document.getElementById('buy-btn').style.display='';
    document.getElementById('buy-btn').textContent=`Buy (${sp.price}₽)`;
    document.getElementById('auction-btn').style.display='';
  }
} else {
  initSetup();
}

// Clear save when starting a new game
const _origStartBtn=document.getElementById('start-game-btn').onclick;
document.getElementById('start-game-btn').onclick=function(){
  clearSave();
  _origStartBtn();
};

// Clear save when game is won
const _origCheckWin=checkWin;
checkWin=function(){
  _origCheckWin();
  if(gamePhase==='gameover') clearSave();
};

// Initialize dice faces after DOM ready
setTimeout(()=>{
  if(document.getElementById('die1')) initDiceFaces();
},0);
</script>

<!-- ============================================================ -->
<!-- MonoFX — 3D "street walk-up" before buying (three.js)        -->
<!-- ============================================================ -->
<script>
(function(){
  const KEY='pkmnMonoFx';
  const MODES=['full','lite','off'];
  const LABELS={full:'Full',lite:'Lite',off:'Off'};
  const getSetting=()=>{ const v=localStorage.getItem(KEY); return MODES.indexOf(v)>=0?v:'full'; };
  const setSetting=v=>{ try{localStorage.setItem(KEY,v);}catch(e){} };
  const enabled=()=>getSetting()!=='off';
  const label=()=>'FX: '+LABELS[getSetting()];
  const cycleSetting=()=>{ const n=MODES[(MODES.indexOf(getSetting())+1)%MODES.length]; setSetting(n); return n; };

  let _bypass=false, currentFinish=null;
  function shouldPlay(sp){
    if(_bypass){ _bypass=false; return false; }
    return enabled() && (sp.type==='property'||sp.type==='railroad'||sp.type==='utility') && sp.owner===-1;
  }

  const el=id=>document.getElementById(id);
  function showOverlay(o){
    el('mfx-caption').innerHTML=`<div class="mfx-name">${o.name}</div>`+(o.price?`<div class="mfx-price">${o.price}₽</div>`:'');
    const ov=el('mfx-overlay'); ov.classList.add('show'); ov.style.opacity='0'; requestAnimationFrame(()=>ov.style.opacity='1');
  }
  function hideOverlay(){
    const ov=el('mfx-overlay'); ov.style.opacity='0';
    setTimeout(()=>{ ov.classList.remove('show'); el('mfx-canvas').style.display='block'; el('mfx-canvas2d').style.display='none'; },260);
  }

  function shade(hex,amt){
    const n=parseInt(String(hex).replace('#',''),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    const f=amt<0?0:255, p=Math.abs(amt);
    r=Math.round(r+(f-r)*p); g=Math.round(g+(f-g)*p); b=Math.round(b+(f-b)*p);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function wrapText(ctx,text,cx,y,maxW,lh){
    const words=String(text).split(' '); let line='',lines=[];
    for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW&&line){ lines.push(line); line=w; } else line=test; }
    if(line)lines.push(line); lines=lines.slice(0,2);
    lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lh));
  }
  function canvasTexture(THREE,draw,w,h){ const cv=document.createElement('canvas'); cv.width=w; cv.height=h||w; draw(cv.getContext('2d'),cv.width,cv.height); return new THREE.CanvasTexture(cv); }
  function loadTex(loader,url){ return new Promise((res,rej)=>loader.load(url,res,undefined,rej)); }

  let renderer=null, camera=null;

  function playStreet(sp,idx,done){
    const color=(sp.group&&typeof GROUP_COLORS!=='undefined')?GROUP_COLORS[sp.group]:'#ffcb05';
    const spriteId=(typeof SPACE_POKEMON!=='undefined'&&SPACE_POKEMON[idx])||25;
    let called=false;
    const o={ name:sp.name, price:sp.price, color, spriteId, done:()=>{ if(called)return; called=true; _bypass=true; done&&done(); } };
    showOverlay(o);
    setTimeout(()=>{ if(!called){ if(currentFinish){ const f=currentFinish; currentFinish=null; f(); } else { hideOverlay(); o.done(); } } },5200);
    if(getSetting()==='lite'){ run2D(o); }
    else if(window.GK&&GK.loadThree){ GK.loadThree(THREE=>{ if(!THREE){ run2D(o); return; } try{ run3D(THREE,o); }catch(e){ console.warn('MonoFX 3D failed',e); run2D(o); } }); }
    else { run2D(o); }
  }

  function run3D(THREE,o){
    el('mfx-canvas').style.display='block'; el('mfx-canvas2d').style.display='none';
    const canvas=el('mfx-canvas');
    if(!renderer){ renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); camera=new THREE.PerspectiveCamera(58,1,0.1,100); }
    const W=window.innerWidth,H=window.innerHeight; renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
    const scene=new THREE.Scene();
    const sky=shade(o.color,-0.55); scene.background=new THREE.Color(sky); scene.fog=new THREE.Fog(sky,9,28);

    const roadTex=canvasTexture(THREE,(ctx,w,h)=>{ ctx.fillStyle='#2b2b33'; ctx.fillRect(0,0,w,h); ctx.fillStyle='#ffd95e'; for(let y=0;y<h;y+=64)ctx.fillRect(w/2-6,y,12,36); ctx.fillStyle=o.color; ctx.fillRect(0,0,12,h); ctx.fillRect(w-12,0,12,h); },128,512);
    roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping; roadTex.repeat.set(1,6);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(6,42),new THREE.MeshBasicMaterial({map:roadTex}));
    road.rotation.x=-Math.PI/2; road.position.z=-13; scene.add(road);

    for(let i=0;i<9;i++){
      for(const side of [-1,1]){
        const ht=2+((i*7+(side>0?3:0))%5)*0.7;
        const col=shade(o.color,(i%3-1)*0.18-0.08);
        const m=new THREE.Mesh(new THREE.BoxGeometry(2.4,ht,2.2),new THREE.MeshBasicMaterial({color:col}));
        m.position.set(side*3.5,ht/2,-2-i*2.0); scene.add(m);
      }
    }

    const signTex=canvasTexture(THREE,(ctx,w,h)=>{
      ctx.fillStyle='rgba(10,12,20,.93)'; roundRect(ctx,4,4,w-8,h-8,20); ctx.fill();
      ctx.strokeStyle=o.color; ctx.lineWidth=4; roundRect(ctx,4,4,w-8,h-8,20); ctx.stroke();
      ctx.fillStyle=o.color; ctx.fillRect(18,18,w-36,14);
      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 34px Fredoka, sans-serif';
      wrapText(ctx,o.name,w/2,78,w-44,38);
      if(o.price){ ctx.fillStyle='#ffd95e'; ctx.font='bold 30px Fredoka, sans-serif'; ctx.fillText(o.price+'₽',w/2,h-26); }
    },360,200);
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(4,2.2),new THREE.MeshBasicMaterial({map:signTex,transparent:true}));
    sign.position.set(0,3.5,-15.2); scene.add(sign);

    const loader=new THREE.TextureLoader(); loader.crossOrigin='anonymous';
    loadTex(loader,SPRITE_URL(o.spriteId)).then(tex=>{ tex.magFilter=THREE.NearestFilter; addPokeAndRun(tex); }).catch(()=>addPokeAndRun(null));

    function addPokeAndRun(tex){
      let poke=null;
      if(tex){ poke=new THREE.Mesh(new THREE.PlaneGeometry(2.5,2.5),new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.05})); poke.position.set(0,1.35,-13.6); scene.add(poke); }
      const start=performance.now(), DUR=2.3; let finished=false, raf;
      const camFromZ=8.5, camToZ=-9, camY=1.6;
      function finish(){
        if(finished)return; finished=true; cancelAnimationFrame(raf);
        scene.traverse(x=>{ if(x.geometry&&x.geometry.dispose)x.geometry.dispose(); if(x.material){ if(x.material.map&&x.material.map.dispose)x.material.map.dispose(); if(x.material.dispose)x.material.dispose(); } });
        hideOverlay(); o.done();
      }
      currentFinish=finish;
      function frame(now){
        const t=(now-start)/1000, k=Math.min(1,t/DUR), e=1-Math.pow(1-k,2.4);
        camera.position.set(Math.sin(now/650)*0.09, camY+Math.sin(now/320)*0.03, camFromZ+(camToZ-camFromZ)*e);
        camera.lookAt(0,1.6,-15.2);
        if(poke) poke.position.y=1.35+Math.sin(now/240)*0.07;
        sign.position.y=3.5+Math.sin(now/420)*0.05;
        renderer.render(scene,camera);
        if(t>DUR-0.3) el('mfx-overlay').style.opacity=String(Math.max(0,(DUR-t)/0.3));
        if(t>=DUR){ finish(); return; }
        raf=requestAnimationFrame(frame);
      }
      raf=requestAnimationFrame(frame);
    }
  }

  function run2D(o){
    el('mfx-canvas').style.display='none';
    const c=el('mfx-canvas2d'); c.style.display='block';
    const ctx=c.getContext('2d'); const DPR=Math.min(window.devicePixelRatio||1,2), W=window.innerWidth, H=window.innerHeight;
    c.width=W*DPR; c.height=H*DPR; c.style.width=W+'px'; c.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);
    const img=new Image(); img.src=SPRITE_URL(o.spriteId);
    const start=performance.now(), DUR=2.3, horizon=H*0.42, vp=W/2; let finished=false, raf;
    function finish(){ if(finished)return; finished=true; cancelAnimationFrame(raf); hideOverlay(); o.done(); }
    currentFinish=finish;
    function frame(now){
      const t=(now-start)/1000, k=Math.min(1,t/DUR), e=1-Math.pow(1-k,2.4);
      ctx.fillStyle=shade(o.color,-0.5); ctx.fillRect(0,0,W,horizon);
      ctx.fillStyle='#23232b'; ctx.fillRect(0,horizon,W,H-horizon);
      const roadTopW=44, roadBotW=W*0.92;
      ctx.fillStyle='#2b2b33'; ctx.beginPath(); ctx.moveTo(vp-roadTopW/2,horizon); ctx.lineTo(vp+roadTopW/2,horizon); ctx.lineTo(vp+roadBotW/2,H); ctx.lineTo(vp-roadBotW/2,H); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd95e';
      for(let i=0;i<9;i++){ const f=((i/9)+e)%1; const y=horizon+(H-horizon)*f*f; const wd=2+f*12, hh=4+f*26; ctx.fillRect(vp-wd/2,y,wd,hh); }
      for(let i=0;i<6;i++){ const f=((i/6)+e*0.85)%1, persp=f*f; const edge=roadTopW/2+(roadBotW/2-roadTopW/2)*persp; const by=horizon+(H-horizon)*persp; const bw=22+persp*130, bh=40+persp*280; ctx.fillStyle=shade(o.color,(i%3-1)*0.15-0.08); ctx.fillRect(vp-edge-bw,by-bh,bw,bh); ctx.fillRect(vp+edge,by-bh,bw,bh); }
      if(img.complete&&img.naturalWidth){ const sz=Math.min(W,H)*(0.12+e*0.30); ctx.imageSmoothingEnabled=false; const sy=horizon+(H-horizon)*0.5+Math.sin(now/240)*4; ctx.drawImage(img,vp-sz/2,sy-sz/2,sz,sz); }
      if(t>DUR-0.3) el('mfx-overlay').style.opacity=String(Math.max(0,(DUR-t)/0.3));
      if(t>=DUR){ finish(); return; }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  window.MonoFX={ playStreet, shouldPlay, label, getSetting, cycleSetting, enabled };
  window.toggleMonoFx=function(){ cycleSetting(); const b=el('mfx-btn'); if(b)b.innerHTML='✨ '+label(); };

  document.addEventListener('DOMContentLoaded',()=>{
    const b=el('mfx-btn'); if(b)b.innerHTML='✨ '+label();
    const ov=el('mfx-overlay'); if(ov) ov.addEventListener('click',()=>{ if(currentFinish){ const f=currentFinish; currentFinish=null; f(); } });
  });
})();
</script>
