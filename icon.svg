<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="#10131f"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#23284a"/>
      <stop offset="100%" stop-color="#10131f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Poké Ball, kept within central safe zone -->
  <g transform="translate(256,256)">
    <circle r="150" fill="#ffffff" stroke="#0c0e16" stroke-width="14"/>
    <path d="M -150 0 A 150 150 0 0 1 150 0 Z" fill="#ff3b3b"/>
    <rect x="-150" y="-12" width="300" height="24" fill="#0c0e16"/>
    <circle r="46" fill="#0c0e16"/>
    <circle r="34" fill="#ffffff" stroke="#0c0e16" stroke-width="10"/>
    <circle r="16" fill="#e8eefc"/>
  </g>
  <!-- little spark accents -->
  <g fill="#ffcb05">
    <circle cx="96" cy="120" r="6"/>
    <circle cx="420" cy="150" r="5"/>
    <circle cx="400" cy="380" r="6"/>
    <circle cx="110" cy="400" r="5"/>
  </g>
</svg>
